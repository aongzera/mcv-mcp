[project]
name = "mcv-mcp"
version = "0.1.0"
description = "MCP server for MyCourseVille: assignments, deadlines, materials and grades"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcv-mcp = "mcv_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcv_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
